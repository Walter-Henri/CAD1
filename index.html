<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mapa colaborativo de problemas no bairro – Recife. Marque barreiras, alagamentos, buracos e obras paradas para que a associação leve ao vereador.">
  <meta name="color-scheme" content="light dark">
  <title>Mutirão · Recife</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E3A8A'/%3E%3Cpath d='M8 16a8 8 0 1 0 16 0' stroke='%23FFD400' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <!-- Aplicar tema salvo antes do primeiro render para evitar flash -->
  <script>try{var _t=localStorage.getItem('mutirao.theme');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
  <!-- Estilos externos (Leaflet + app) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="src/css/vendor.css">
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="brand" aria-label="Mutirão, ir para o mapa">
    <span class="mark"><svg class="ic"><use href="#i-users"/></svg></span>
    <span><b>Mutirão</b><small>ninguém cobra sozinho</small></span>
  </button>
  <nav class="topnav" aria-label="Seções">
    <button data-go="mapa"><svg class="ic sm"><use href="#i-map"/></svg>Mapa</button>
    <button data-go="ranking"><svg class="ic sm"><use href="#i-rank"/></svg>Ranking</button>
    <button data-go="votacao"><svg class="ic sm"><use href="#i-vote"/></svg>Votação</button>
    <button data-go="conta"><svg class="ic sm"><use href="#i-user"/></svg>Conta</button>
  </nav>
  <div class="topsearch search" id="topsearch">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q1" type="search" placeholder="Buscar bairro ou problema" aria-label="Buscar bairro ou problema" autocomplete="off">
  </div>
  <div class="topright" id="topright"></div>
</header>

<div class="app">
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <section class="mapwrap" aria-label="Mapa de pontos">
    <div id="map"></div>
    <div class="maptools" id="maptools">
      <div class="mtools-search">
        <div class="mtools-title" style="margin-bottom:8px">Mapa de pontos <small id="countSmall"></small></div>
        <div class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="q2" type="search" placeholder="Buscar bairro ou problema" aria-label="Buscar bairro ou problema" autocomplete="off">
        </div>
      </div>
      <div class="mtools-row">
        <button class="fab add" id="btnAdd"><svg class="ic"><use href="#i-plus"/></svg>Adicionar ponto</button>
        <button class="fab more" id="btnMore" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-more"/></svg>Mais ações</button>
      </div>
    </div>
    <div class="menu" id="menu" hidden></div>
    <details class="legend" id="legend">
      <summary><svg class="ic sm"><use href="#i-layers"/></svg>Legenda<svg class="ic sm chev" style="margin-left:auto"><use href="#i-chev"/></svg></summary>
      <div class="lg" id="legendBody"></div>
    </details>
    <svg class="pickpin" id="pickpin" width="46" height="58" viewBox="0 0 46 58" hidden><path d="M23 56s20-18 20-33A20 20 0 0 0 3 23c0 15 20 33 20 33z" fill="#FFD400" stroke="#0B0B0F" stroke-width="3"/><circle cx="23" cy="22" r="7" fill="#0B0B0F"/></svg>
    <div class="pickbar" id="pickbar" hidden>
      <p>Arraste o mapa até o pino ficar em cima do problema.</p>
      <div class="where" id="pickWhere"></div>
      <div class="row"><button class="btn sec" id="pickCancel">Cancelar</button><button class="btn acc" id="pickOk">Usar este local</button></div>
    </div>
  </section>
</div>

<nav class="tabbar" aria-label="Seções">
  <button data-go="mapa"><span class="tabic"><svg class="ic"><use href="#i-map"/></svg></span><span class="tab-lbl">Mapa</span></button>
  <button data-go="ranking"><span class="tabic"><svg class="ic"><use href="#i-rank"/></svg></span><span class="tab-lbl">Ranking</span></button>
  <button data-go="votacao"><span class="tabic"><svg class="ic"><use href="#i-vote"/></svg></span><span class="tab-lbl">Votação</span></button>
  <button data-go="conta"><span class="tabic"><svg class="ic"><use href="#i-user"/></svg></span><span class="tab-lbl">Conta</span></button>
</nav>

<div id="layer"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<!-- Sprite de ícones (inline para evitar request extra) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="i-alag" viewBox="0 0 24 24"><path d="M12 3s5.5 6.2 5.5 10a5.5 5.5 0 0 1-11 0C6.5 9.2 12 3 12 3z"/><path d="M3 20c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/></symbol>
  <symbol id="i-barreira" viewBox="0 0 24 24"><path d="M2 20l7-11 4 5 3-3 6 9z"/><path d="M11 13l1.5 2.5L11 18"/></symbol>
  <symbol id="i-buraco" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="4"/><path d="M6 13.5c1.5-1.4 3.6-2 6-2s4.5.6 6 2"/><path d="M5 7l2 2M19 7l-2 2M12 4v3"/></symbol>
  <symbol id="i-esgoto" viewBox="0 0 24 24"><path d="M3 9h10v6H3z"/><path d="M13 12h3"/><path d="M18 9c1 1.5 3 2.5 3 4.5a2 2 0 0 1-4 0c0-1 .4-1.6 1-2.5"/><path d="M6 19h4"/></symbol>
  <symbol id="i-lixo" viewBox="0 0 24 24"><path d="M5 8h14l-1.3 12H6.3z"/><path d="M3 8h18M9 8V5h6v3"/><path d="M10 12v5M14 12v5"/></symbol>
  <symbol id="i-obra" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20V10h6v10M13 20v-6h6v6"/><path d="M4 6l4-2 4 2 4-2 4 2"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-rank" viewBox="0 0 24 24"><path d="M8 21V11H3v10zM15 21V4h-6v17zM21 21v-7h-6v7z"/></symbol>
  <symbol id="i-vote" viewBox="0 0 24 24"><path d="M4 13h16v7H4z"/><path d="M8 13l2-9h6l-2 9"/><path d="M10 9l2 2 3-3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.5-3.6 3-5.5 6-5.5s5.5 1.9 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.4.3 4 2 4.5 5.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 12h8M8 16h6"/></symbol>

  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
 </defs>
</svg>

<!-- Dependências de mapa (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<!-- Dados (globais, devem ser carregados antes de app.js) -->
<script src="src/js/data/bairros.js"></script>
<script src="src/js/data/vizinhos.js"></script>
<script src="src/js/data/seed.js"></script>

<script src="src/js/data/riscos.js"></script>
<!-- Config de ambiente (CARTO_API_KEY injetada no build) -->
<script src="src/js/data/env.js"></script>
<!-- Lógica da aplicação -->
<script src="src/js/app.js"></script>

<noscript>Este mapa precisa de JavaScript para funcionar.</noscript>
</body>
</html>
